<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — SoftwareDonkey</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%23F7EDD8'/%3E%3Cg%3E%3Crect%20x='28'%20y='12'%20width='12'%20height='34'%20rx='6'%20fill='%23857468'%20stroke='%2326201B'%20stroke-width='5'/%3E%3Crect%20x='60'%20y='12'%20width='12'%20height='34'%20rx='6'%20fill='%23857468'%20stroke='%2326201B'%20stroke-width='5'/%3E%3Cellipse%20cx='50'%20cy='62'%20rx='28'%20ry='26'%20fill='%23857468'%20stroke='%2326201B'%20stroke-width='5'/%3E%3Cellipse%20cx='50'%20cy='72'%20rx='16'%20ry='12'%20fill='%23FDF8EC'%20stroke='%2326201B'%20stroke-width='4'/%3E%3Ccircle%20cx='40'%20cy='54'%20r='4'%20fill='%2326201B'/%3E%3Ccircle%20cx='60'%20cy='54'%20r='4'%20fill='%2326201B'/%3E%3Ccircle%20cx='44'%20cy='72'%20r='2.5'%20fill='%2326201B'/%3E%3Ccircle%20cx='56'%20cy='72'%20r='2.5'%20fill='%2326201B'/%3E%3C/g%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F7EDD8;
      --ink: #26201B;
      --tomato: #D8491B;
      --mustard: #F2B035;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: var(--cream);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: "Space Mono", monospace;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--tomato);
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; }
    p { max-width: 34ch; line-height: 1.6; }
    a.home {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.85rem 1.6rem;
      background: var(--mustard);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--ink);
      font-family: "Space Mono", monospace;
      font-weight: 700;
      text-decoration: none;
    }
    a.home:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    svg { width: min(160px, 40vw); height: auto; }
  </style>
</head>
<body>
  <svg viewBox="0 0 100 100" role="img" aria-label="SoftwareDonkey mascot">
    <rect width="100" height="100" rx="22" fill="#F7EDD8"/>
    <rect x="28" y="12" width="12" height="34" rx="6" fill="#857468" stroke="#26201B" stroke-width="5"/>
    <rect x="60" y="12" width="12" height="34" rx="6" fill="#857468" stroke="#26201B" stroke-width="5"/>
    <ellipse cx="50" cy="62" rx="28" ry="26" fill="#857468" stroke="#26201B" stroke-width="5"/>
    <ellipse cx="50" cy="72" rx="16" ry="12" fill="#FDF8EC" stroke="#26201B" stroke-width="4"/>
    <circle cx="40" cy="54" r="4" fill="#26201B"/>
    <circle cx="60" cy="54" r="4" fill="#26201B"/>
    <circle cx="44" cy="72" r="2.5" fill="#26201B"/>
    <circle cx="56" cy="72" r="2.5" fill="#26201B"/>
  </svg>
  <div class="code">ERROR 404</div>
  <h1>This trail goes nowhere.</h1>
  <p>The donkey sniffed around and found nothing here. Best head back to the barn.</p>
  <a class="home" href="/">Back to the barn</a>
</body>
</html>
